<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STUDY FLOW">
<title>STUDY FLOW</title>
<style>
:root{--bg:#f6f4ef;--paper:#fff;--ink:#252525;--muted:#858585;--line:#e9e6df;--accent:#343c54;--shadow:0 8px 26px #28231a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:22px 22px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:#343c54;color:white;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}
h1{font-size:21px;letter-spacing:1.4px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 13px;font-size:13px;color:#343434}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.small{padding:6px 9px;font-size:11px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px;gap:10px}.monthnav{display:flex;align-items:center;gap:12px}.monthnav strong{font-size:22px;min-width:130px}.navbtn{border:0;background:white;border-radius:10px;width:34px;height:34px;font-size:18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.calendar{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{text-align:center;padding:12px 3px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.weekday:first-child{color:#d16b68}
.day{min-height:122px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 6px;position:relative;min-width:0;cursor:pointer}.day:nth-child(7n){border-right:0}.day.other{background:#faf9f6}.day.today .num{background:var(--accent);color:white}.day.sunday .num{color:#d16b68}.num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:12px;margin-bottom:5px}.other .num{color:#b8b5ae}
.rest{position:absolute;right:6px;top:10px;color:#d16b68;font-size:10px;background:#fff1ef;border-radius:6px;padding:2px 5px}.task{position:relative;margin:3px 0;padding:5px 18px 5px 7px;border-radius:6px;font-size:10px;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#252525;touch-action:pan-y;user-select:none;cursor:grab;border-left:3px solid var(--c)}
.task.done{opacity:.58;text-decoration:line-through}.task .grip{position:absolute;right:0;top:0;width:15px;height:100%;cursor:ew-resize;display:flex;align-items:center;justify-content:center;color:#555;font-size:12px;touch-action:none}.task.dragging{opacity:.35}.day.drop{background:#f0f2f8;outline:2px dashed #66708c;outline-offset:-3px}
.side{display:flex;flex-direction:column;gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:14px;margin:0 0 12px}.stat{display:flex;justify-content:space-between;font-size:13px;margin:9px 0}.stat b{font-size:15px}.hint{font-size:11px;color:var(--muted);line-height:1.65}.empty{font-size:12px;color:#aaa;text-align:center;padding:14px 0}
.bookrow,.savedrow{display:flex;align-items:center;gap:8px;font-size:12px;margin:8px 0;min-width:0}.bookrow .name,.savedrow .desc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bookrow button{margin-left:auto;border:0;background:#f5f3ef;border-radius:7px;padding:5px 8px;font-size:11px;flex-shrink:0}
.savedrow{align-items:flex-start;border-top:1px solid #f0eee9;padding-top:9px}.savedrow .desc{flex:1;white-space:normal;line-height:1.4}.savedrow .savedactions{display:flex;gap:4px;flex-shrink:0}
.modalback{position:fixed;inset:0;background:#17171766;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{background:white;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 16px;font-size:18px}.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}.field{min-width:0}.field input,.field select{min-width:0;max-width:100%;display:block}.field input[type="date"],.field input[type="number"]{width:100%;min-width:0;min-height:42px}#duration{text-align:center}.checkrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.checkrow label{display:flex;align-items:center;gap:5px;font-size:12px;color:#444}.checkrow input{width:auto!important}.goalrow{border-top:1px solid #f0eee9;padding:10px 0}.goalrow:first-child{border-top:0}.goalhead{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px}.goalbar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:8px 0}.goalbar>span{display:block;height:100%;background:#7183b5;border-radius:99px}.goalmeta{font-size:11px;color:#777;line-height:1.5}.monthbook{padding:8px 0;border-top:1px solid #f0eee9}.monthbook:first-child{border-top:0}.monthbook b{font-size:12px}.monthbook small{display:block;color:#777;font-size:11px;margin-top:3px;line-height:1.45}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#777}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:#222}.modalfoot{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.rightbuttons{display:flex;gap:8px}.selectwrap{position:relative}.selectwrap select{appearance:auto}
.choice-list{border:1px solid var(--line);border-radius:10px;max-height:160px;overflow:auto;margin-top:5px;display:none}.choice-list.show{display:block}.choice{padding:9px 10px;font-size:12px;border-bottom:1px solid #f2f0ec;cursor:pointer}.choice:last-child{border-bottom:0}.choice:active{background:#f4f3ef}
.dateitems{display:flex;flex-direction:column;gap:8px}.dateitem{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}.dateitem span{min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#282d3e;color:white;padding:10px 15px;border-radius:10px;font-size:12px;display:none;z-index:20}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.day{min-height:105px}}
@media(max-width:560px){.app{padding:14px 10px 30px}header{align-items:flex-start}.sub{max-width:180px}.actions .btn{padding:8px 9px;font-size:11px}.layout{gap:10px}.day{min-height:94px;padding:5px 3px}.num{width:22px;height:22px;margin-bottom:3px}.task{font-size:9px;padding:4px 12px 4px 5px}.weekday{font-size:10px;padding:9px 1px}.side{grid-template-columns:1fr}.monthnav strong{font-size:19px;min-width:118px}.toolbar{margin-top:12px}.rest{right:3px;top:8px;font-size:9px;padding:1px 3px}.modal{padding:16px}.formgrid{gap:9px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

.panel-tools{display:flex;gap:5px;align-items:center}.weekpick{display:flex;gap:6px;flex-wrap:wrap}.weekpick label{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11px;display:flex;gap:4px;align-items:center}.weekpick input{width:auto!important;margin:0}.row-actions{display:flex;gap:4px;flex-shrink:0}.tiny{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 7px;font-size:10px}.goalrow{border-left:4px solid var(--goal-color,#7183b5);padding-left:9px}.goalbar>span{background:var(--goal-color,#7183b5)}.done-date{color:#18794e}.muted-date{color:#888}.panel h2{line-height:1.4}.savedrow .desc{white-space:normal}
#duration{width:100%;min-width:0;box-sizing:border-box}

#bookCount{cursor:pointer}
.stats-detail{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.stats-monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:12px}
.stats-chart{width:148px;height:148px;border-radius:50%;margin:10px auto 14px;position:relative}
.stats-chart:after{content:'';position:absolute;inset:25px;border-radius:50%;background:var(--paper,#fff)}
.stats-legend{display:grid;grid-template-columns:1fr auto;gap:7px;font-size:12px}
.stats-legend .subject{display:flex;align-items:center;gap:7px}
.stats-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.goal-edit-actions{display:flex;gap:4px;flex-shrink:0}
.goal-edit-actions button{border:1px solid var(--line);background:white;border-radius:7px;padding:5px 7px;font-size:10px}

</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">SF</div><div><h1>STUDY FLOW</h1><div class="sub">나만의 공부 일정 캘린더</div></div></div>
<div class="actions"><button class="btn" id="undoBtn">↶ 뒤로</button><button class="btn" id="redoBtn">↷ 앞으로</button><button class="btn" id="settingsBtn">설정</button><button class="btn" id="helpBtn">사용 방법</button><button class="btn" id="backup">백업</button><button class="btn" id="restoreBtn">복원</button><input id="restoreFile" type="file" accept="application/json" hidden><button class="btn primary" id="addBtn">＋ 일정 추가</button></div></header>
<div class="toolbar"><div class="monthnav"><button class="navbtn" id="prev">‹</button><strong id="monthTitle"></strong><button class="navbtn" id="next">›</button></div><button class="btn" id="todayBtn">오늘</button></div>
<div class="layout"><section class="calendar"><div class="weekdays"><div class="weekday">일</div><div class="weekday">월</div><div class="weekday">화</div><div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday">토</div></div><div class="days" id="days"></div></section>
<aside class="side">
<div class="panel" id="statsPanel"><h2>이번 달 공부 현황</h2><div class="stat"><span>공부한 날짜</span><b id="taskCount">0일</b></div><div class="stat"><span>완료 일정</span><b id="doneCount">0개</b></div><div class="stat"><span>공부 문제집</span><b id="bookCount" role="button" tabindex="0" title="월별 과목 공부 비중 보기" style="cursor:pointer;text-decoration:underline;text-underline-offset:3px">0권</b></div><div id="monthDetails" class="hint" style="margin-top:10px"></div></div>
<div class="panel" id="goalPanel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">회독 목표</h2><div class="panel-tools"><button class="btn small" id="goalEditBtn">편집</button><button class="btn small" id="goalMore">더보기</button><button class="btn small" id="addGoalBtn" style="display:none">＋ 목표 추가</button></div></div><div id="goalList" style="margin-top:8px"></div></div>
<div class="panel" id="bookPanel"><h2>문제집 목록</h2><div id="bookList"></div></div>
<div class="panel" id="savedPanel"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">내 일정 보관함</h2><div class="panel-tools"><button class="btn small" id="savedEditBtn">편집</button><button class="btn small" id="savedMore">더보기</button></div></div><div id="savedList"></div></div>

</aside></div></div>
<div class="modalback" id="modalback"><div class="modal"><h2 id="modalTitle">일정 추가</h2>
<div class="formgrid">
<div class="field"><label>과목</label><select id="subject"><option>국어</option><option>영어</option><option>행정법</option><option>행정학</option><option>기타</option></select></div>
<div class="field"><label>문제집</label><input id="book" autocomplete="off" placeholder="문제집 이름을 입력하거나 선택"><div class="choice-list" id="bookChoices"></div></div>
<div class="field"><label>시작일</label><input id="start" type="date"></div><div class="field"><label>공부일 수</label><input id="duration" type="number" min="1" max="365" value="3"></div><div class="field full"><label>공부에서 제외할 요일</label><div class="weekpick" id="excludeDaysPicker"></div><span class="hint">선택한 요일은 공부일 수와 일정 기간 계산에서 제외돼요.</span></div><input id="excludeSunday" type="checkbox" checked hidden>
<div class="field full"><label>단원 / 범위</label><input id="range" placeholder="예: 1단원 ~ 3단원"></div>
<div class="field full"><label>달력에 표시할 항목</label><div class="checkrow"><label><input id="showSubject" type="checkbox" checked> 과목</label><label><input id="showBook" type="checkbox" checked> 문제집</label><label><input id="showRange" type="checkbox" checked> 단원·범위</label></div></div>
<div class="field"><label>색상</label><input id="color" type="color" value="#f5c7c4"></div><div class="field"><label>완료 여부</label><select id="done"><option value="false">진행 중</option><option value="true">완료</option></select></div>
</div><div class="modalfoot"><button class="btn" id="deleteBtn" style="display:none">일정 삭제</button><div class="rightbuttons"><button class="btn" id="cancelBtn">취소</button><button class="btn primary" id="saveBtn">저장</button></div></div></div></div>
<div class="modalback" id="dayBack"><div class="modal"><h2 id="dayTitle">날짜 일정</h2><div id="dayItems" class="dateitems"></div><div class="modalfoot"><button class="btn" id="dayAdd">＋ 이 날짜에 일정 추가</button><div class="rightbuttons"><button class="btn" id="deleteDayBtn" style="color:#b42318;border-color:#efc7c4">이 날짜 전체 삭제</button><button class="btn" id="dayClose">닫기</button></div></div></div></div>
<div class="modalback" id="goalBack"><div class="modal"><h2 id="goalModalTitle">회독 목표 설정</h2><div class="formgrid">
<div class="field"><label>과목</label><select id="goalSubject"><option>국어</option><option>영어</option><option>행정법</option><option>행정학</option><option>기타</option></select></div>
<div class="field"><label>문제집</label><input id="goalBook" placeholder="예: 행정법 기출"></div>
<div class="field"><label>전체 단원 수</label><input id="goalUnits" type="number" min="1" value="6"></div><div class="field"><label>목표 회독 수</label><input id="goalRounds" type="number" min="1" value="5"></div>
<div class="field"><label>현재 회독</label><input id="goalCurrentRound" type="number" min="1" value="1"></div><div class="field"><label>현재 회독의 단원</label><input id="goalCurrentUnit" type="text" inputmode="text" value="0단원" placeholder="예: 3단원, 행정행위, 15~20번"></div></div><div class="hint" style="margin-top:10px">예: 전체 6단원, 목표 5회독, 현재 2회독 6단원이면 2회독을 마친 상태로 계산해요. 다음은 3회독 1단원이에요.</div><div class="modalfoot"><button class="btn" id="deleteGoalBtn" style="display:none">목표 삭제</button><div class="rightbuttons"><button class="btn" id="cancelGoalBtn">취소</button><button class="btn primary" id="saveGoalBtn">저장</button></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='study-flow-v2-data';
const palette={국어:'#f2b8b5',영어:'#f4c58e',행정법:'#b8c9eb',행정학:'#e8b9d7',기타:'#c9c9c9'};
let data={tasks:[],books:{},goals:{}},view=new Date(),editing=null,gesture=null,toastTimer=null,selectedDay=null,editingGoal=null;
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{let d=fromISO(s);d.setDate(d.getDate()+n);return iso(d)};
let workEnd=(start,dur,excludeSunday=false)=>{let d=fromISO(start),count=0;while(count<Math.max(1,dur)){if(!excludeSunday||d.getDay()!==0)count++;if(count<Math.max(1,dur))d.setDate(d.getDate()+1)}return iso(d)};
let workCount=(a,b,excludeSunday=false)=>{let d=fromISO(a),e=fromISO(b),n=0;while(d<=e){if(!excludeSunday||d.getDay()!==0)n++;d.setDate(d.getDate()+1)}return n};
let isActive=(t,key)=>key>=t.start&&key<=t.end&&!(t.skipDates||[]).includes(key)&&!(t.excludeSunday&&fromISO(key).getDay()===0);
function bookKey(subject,book){return subject+'::'+book}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.tasks)){data={tasks:x.tasks.map(t=>({...t,skipDates:Array.isArray(t.skipDates)?t.skipDates:[],showSubject:t.showSubject!==false,showBook:t.showBook!==false,showRange:t.showRange!==false,excludeSunday:t.excludeSunday!==false})),books:x.books||{},goals:x.goals||{}};for(const [k,v] of Object.entries(data.books)){if(!k.includes('::')){let task=data.tasks.find(t=>t.book===k);let nk=bookKey(task?.subject||'기타',k);if(!data.books[nk])data.books[nk]=v;delete data.books[k]}}}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function showToast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 $('monthTitle').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;
 const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
 const today=iso(new Date()),days=$('days');days.innerHTML='';
 for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=iso(d),cell=document.createElement('div');cell.className='day'+(d.getMonth()!==view.getMonth()?' other':'')+(d.getDay()===0?' sunday':'')+(key===today?' today':'');cell.dataset.date=key;
 cell.innerHTML=`<div class="num">${d.getDate()}</div>${d.getDay()===0?'<span class="rest">휴식</span>':''}`;
 data.tasks.filter(t=>isActive(t,key)).forEach(t=>{let el=document.createElement('div');el.className='task'+(t.done?' done':'');el.style.setProperty('--c',t.color||palette[t.subject]||'#ccc');el.style.background=(t.color||palette[t.subject]||'#ccc')+'66';el.dataset.id=t.id;el.dataset.date=key;
 let labels=[];if(t.showSubject!==false)labels.push(esc(t.subject));if(t.showBook!==false&&t.book)labels.push(esc(t.book));let title=labels.join(' · ');if(t.showRange!==false&&t.range)title+=(title?' / ':'')+esc(t.range);el.innerHTML=`<span>${title||'일정'}</span>${key===t.end?'<span class="grip" title="기간 조절">⋮</span>':''}`;
 el.addEventListener('click',e=>{e.stopPropagation();if(!el.dataset.suppress)openEdit(t.id)});el.addEventListener('pointerdown',startGesture);cell.appendChild(el)});
 cell.addEventListener('click',()=>openDay(key));days.appendChild(cell)}
 const month=iso(new Date(view.getFullYear(),view.getMonth(),1)).slice(0,7);
 const monthStart=month+'-01',monthEnd=iso(new Date(view.getFullYear(),view.getMonth()+1,0));let activeDays=new Set(),monthly={};
 data.tasks.forEach(t=>{let d=t.start>monthStart?t.start:monthStart,end=t.end<monthEnd?t.end:monthEnd;while(d<=end){if(isActive(t,d)){activeDays.add(d);let k=bookKey(t.subject,t.book||'문제집 미입력');if(!monthly[k])monthly[k]={subject:t.subject,book:t.book||'문제집 미입력',days:new Set(),ranges:new Set()};monthly[k].days.add(d);if(t.range)monthly[k].ranges.add(t.range)}d=addDays(d,1)}});

<script>

// --- Schedule handling refinements ---
function isDayDone(t,key){return !!t.done||(t.doneDates||[]).includes(key)}
function cascadeAfter(anchor){
  const later=data.tasks.filter(t=>t.id!==anchor.id&&t.start>=anchor.start).sort((a,b)=>a.start.localeCompare(b.start));
  let cursor=anchor.end;
  for(const t of later){
    // Completed schedules are fixed and never cascaded.
    if(t.done){if(t.end>cursor)cursor=t.end;continue}
    const completed=(t.doneDates||[]).filter(d=>d>=t.start&&d<=t.end);
    if(completed.length){
      // Preserve completed dates as fixed exclusions; move only the unfinished portion.
      const originalStart=t.start, originalEnd=t.end;
      const unfinished=Math.max(0,(t.duration||workCount(originalStart,originalEnd,!!t.excludeSunday))-
        new Set(completed).size);
      if(!unfinished){if(t.end>cursor)cursor=t.end;continue}
      const fixed=completed.sort();
      let newStart=addDays(cursor,1);
      while(t.excludeSunday&&fromISO(newStart).getDay()===0)newStart=addDays(newStart,1);
      t.start=fixed[0]<newStart?fixed[0]:newStart;
      t.skipDates=[...new Set([...(t.skipDates||[]),...fixed])];
      let movedStart=newStart;
      t.end=workEnd(movedStart,unfinished,!!t.excludeSunday);
      if(t.end<fixed[fixed.length-1])t.end=fixed[fixed.length-1];
      if(t.end>cursor)cursor=t.end;
      continue;
    }
    if(t.start<=cursor){
      const dur=Math.max(1,t.duration||workCount(t.start,t.end,!!t.excludeSunday));
      let ns=addDays(cursor,1);
      while(t.excludeSunday&&fromISO(ns).getDay()===0)ns=addDays(ns,1);
      t.start=ns;t.end=workEnd(ns,dur,!!t.excludeSunday);
      t.skipDates=(t.skipDates||[]).filter(x=>x<t.start||x>t.end);
      cursor=t.end;
    }else if(t.end>cursor)cursor=t.end;
  }
}
function openDay(key){
  selectedDay=key;const d=fromISO(key);
  $('dayTitle').textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일${d.getDay()===0?' · 휴식일':''}`;
  const tasks=data.tasks.filter(t=>isActive(t,key));
  $('dayItems').innerHTML=tasks.length?tasks.map(t=>{
    const done=isDayDone(t,key);
    return `<div class="dateitem"><span><b>${esc(t.subject)} · ${esc(t.book||'')}</b><br>${esc(t.range||'범위 없음')}<br><small class="${done?'done-date':'muted-date'}">${done?'완료':'미완료'}</small></span><div class="row-actions"><button class="btn small" data-date-done="${esc(t.id)}">${done?'완료 취소':'이 날짜 완료'}</button><button class="btn small" data-cancel-date="${esc(t.id)}">이 날짜만 취소</button></div></div>`;
  }).join(''):'<div class="empty">이 날짜에 등록된 일정이 없어요.</div>';
  $('dayItems').querySelectorAll('[data-cancel-date]').forEach(b=>b.onclick=()=>{
    const t=data.tasks.find(x=>x.id===b.dataset.cancelDate);if(!t)return;
    if(!confirm('이 날짜의 일정만 취소할까요? 다른 날짜 일정은 그대로 유지돼요.'))return;
    t.skipDates=[...new Set([...(t.skipDates||[]),key])];
    t.duration=Math.max(0,(t.duration||workCount(t.start,t.end,!!t.excludeSunday))-1);
    save();openDay(key);render();showToast('선택한 날짜만 취소했어요.');
  });
  $('dayItems').querySelectorAll('[data-date-done]').forEach(b=>b.onclick=()=>{
    const t=data.tasks.find(x=>x.id===b.dataset.dateDone);if(!t)return;
    t.doneDates=t.doneDates||[];
    if(t.doneDates.includes(key))t.doneDates=t.doneDates.filter(x=>x!==key);else t.doneDates.push(key);
    save();openDay(key);render();
  });
  const excludeBtn=document.createElement('button');
  excludeBtn.className='btn small';excludeBtn.textContent='＋ 이 날짜를 일정 제외일로 설정';
  excludeBtn.onclick=()=>{
    const candidates=data.tasks.filter(t=>t.start<=key&&t.end>=key&&!isActive(t,key));
    if(!tasks.length){showToast('먼저 일정을 등록한 뒤 해당 일정에서 날짜를 제외할 수 있어요.');return}
    const target=tasks[0];
    if(!confirm(`${target.subject} 일정에서 ${key}을(를) 제외할까요?`))return;
    target.skipDates=[...new Set([...(target.skipDates||[]),key])];
    target.duration=Math.max(0,(target.duration||workCount(target.start,target.end,!!target.excludeSunday))-1);
    save();openDay(key);render();showToast('해당 날짜를 제외했어요.');
  };
  $('dayItems').appendChild(excludeBtn);
  $('dayBack').classList.add('show');
}
// Add explicit one-off dates to omit while creating/editing a schedule.
(function(){
  const field=document.createElement('div');field.className='field full';
  field.innerHTML='<label>일정에서 제외할 날짜</label><div style="display:flex;gap:8px;align-items:center"><input id="oneOffExcludeDate" type="date" style="flex:1"><button type="button" class="btn small" id="addOneOffExclude">날짜 추가</button></div><div id="oneOffExcludeList" class="hint" style="margin-top:6px">선택한 날짜에는 이 일정이 배정되지 않아요.</div>';
  $('excludeDaysPicker').parentElement.after(field);
  let chosen=[];
  function draw(){ $('oneOffExcludeList').innerHTML=chosen.length?chosen.sort().map(d=>`<span style="display:inline-flex;gap:5px;margin:3px;padding:4px 7px;background:#eee;border-radius:8px">${d}<button type="button" data-remove-exdate="${d}">×</button></span>`).join(''):'선택한 날짜 없음';field.querySelectorAll('[data-remove-exdate]').forEach(b=>b.onclick=()=>{chosen=chosen.filter(x=>x!==b.dataset.removeExdate);draw()})}
  $('addOneOffExclude').onclick=()=>{const d=$('oneOffExcludeDate').value;if(!d)return showToast('제외할 날짜를 선택해 주세요.');if(!chosen.includes(d))chosen.push(d);$('oneOffExcludeDate').value='';draw()};
  const oldOpenNew=openNew;
  openNew=function(date){oldOpenNew(date);chosen=[];draw()};
  const oldOpenEdit=openEdit;
  openEdit=function(id){oldOpenEdit(id);const t=data.tasks.find(x=>x.id===id);chosen=[...(t?.skipDates||[])];draw()};
  const oldSave=$('saveBtn').onclick;
  $('saveBtn').onclick=function(){
    const before=editing?data.tasks.find(t=>t.id===editing):null;
    oldSave();
    if(before){before.skipDates=[...new Set(chosen)];save();render()}
    else{
      const start=$('start').value;
      const created=[...data.tasks].filter(t=>t.start===start).sort((a,b)=>b.start.localeCompare(a.start))[0];
      if(created&&chosen.length){created.skipDates=[...new Set(chosen)];created.duration=Math.max(1,created.duration||1);save();render()}
    }
  };
  draw();
})();

</script>

<script>

// Final cascade override: preserve completed dates and move only unfinished study days.
cascadeAfter=function(anchor){
  const later=data.tasks
    .filter(t=>t.id!==anchor.id && t.start>=anchor.start)
    .sort((a,b)=>a.start.localeCompare(b.start));
  let cursor=anchor.end;
  for(const t of later){
    const ex=excluded(t);
    const originalStart=t.start, originalEnd=t.end;
    const completed=[...new Set((t.doneDates||[]).filter(d=>d>=originalStart&&d<=originalEnd))].sort();
    // A task marked fully complete is always fixed in place.
    if(t.done){ if(t.end>cursor)cursor=t.end; continue; }
    const originalDays=[];
    let day=originalStart;
    while(day<=originalEnd){
      if(isActive(t,day))originalDays.push(day);
      day=addDays(day,1);
    }
    const unfinished=originalDays.filter(d=>!completed.includes(d));
    if(!unfinished.length){if(t.end>cursor)cursor=t.end;continue;}
    if(originalStart<=cursor){
      let movedStart=addDays(cursor,1);
      while(ex.includes(fromISO(movedStart).getDay()))movedStart=addDays(movedStart,1);
      const movedEnd=workEnd(movedStart,unfinished.length,false,ex);
      // Keep the original interval's completed dates visible; hide the gap and
      // relocate only the unfinished days after the preceding schedule.
      const fixedStart=completed.length?completed[0]:originalStart;
      const gap=[];
      let g= fixedStart;
      while(g<movedStart){if(!completed.includes(g))gap.push(g);g=addDays(g,1)}
      t.start=fixedStart;
      t.end=movedEnd;
      t.skipDates=[...new Set([...(t.skipDates||[]).filter(d=>d<fixedStart||d>movedEnd),...gap])];
      cursor=movedEnd;
    }else if(t.end>cursor){
      cursor=t.end;
    }
  }
};

</script>
